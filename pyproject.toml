[project]
name = "finlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gustavo Rocha", email = "gustavooliveirarocha@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "qdrant-client[fastembed]>=1.20.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
finlab = "finlab:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
